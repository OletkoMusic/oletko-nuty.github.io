<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admina — Oletko Nuty</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #121212; color: #e0e0e0; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 600px; background: #1e1e1e; padding: 25px; border-radius: 12px; border: 1px solid #333; }
        h1 { text-align: center; margin-bottom: 20px; color: #007bff; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; padding: 10px; background: #2d2d2d; color: #fff; border: 1px solid #444; border-radius: 6px; }
        .btn { width: 100%; padding: 12px; background: #28a745; color: white; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; margin-top: 10px; }
        .btn:hover { background: #218838; }
        .btn-danger { background: #dc3545; margin-top: 5px; padding: 6px 10px; font-size: 0.8rem; width: auto; }
        .btn-danger:hover { background: #c82333; }
        .sheet-item { display: flex; justify-content: space-between; align-items: center; background: #282828; padding: 10px; border-radius: 6px; margin-bottom: 8px; border: 1px solid #333; }
        #login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #121212; display: flex; justify-content: center; align-items: center; z-index: 999; }
        .login-box { background: #1e1e1e; padding: 30px; border-radius: 8px; border: 1px solid #333; text-align: center; width: 300px; }
    </style>
</head>
<body>

    <div id="login-overlay">
        <form class="login-box" id="loginForm">
            <h2 style="margin-bottom: 15px;">Panel Admina</h2>
            <input type="password" id="adminPass" placeholder="Wpisz hasło..." style="margin-bottom: 15px;" required>
            <button type="submit" class="btn" id="loginBtn">Zaloguj się</button>
        </form>
    </div>

    <div class="container">
        <h1>⚙️ Zarządzanie Nutami</h1>
        <p style="text-align: center; margin-bottom: 20px;"><a href="index.html" style="color: #007bff;">← Powrót do strony głównej</a></p>

        <div style="margin-bottom: 20px; text-align: center;">
            <button class="btn" style="background: #dc3545;" id="resetBtn">🔄 Wyczyść duplikaty i przywróć bazę nut</button>
        </div>

        <form id="addSheetForm">
            <div class="form-group">
                <label>Tytuł utworu:</label>
                <input type="text" id="title" placeholder="np. Dla Elizy" required>
            </div>
            <div class="form-group">
                <label>Kompozytor / Autor:</label>
                <input type="text" id="author" placeholder="np. L. v. Beethoven" required>
            </div>
            <div class="form-group">
                <label>Instrument:</label>
                <select id="instrument">
                    <option value="piano">Fortepian</option>
                    <option value="sax">Saksofon</option>
                    <option value="trumpet">Trąbka</option>
                    <option value="accordion">Akordeon</option>
                </select>
            </div>
            <div class="form-group" id="subCatGroup" style="display: none;">
                <label>Kategoria podrzędna / Wariant:</label>
                <select id="subCategory">
                    <option value="alt">Saksofon Altowy</option>
                    <option value="tenor">Saksofon Tenorowy</option>
                    <option value="b">Trąbka B♭</option>
                    <option value="es">Trąbka E♭</option>
                </select>
            </div>
            <div class="form-group">
                <label>Poziom trudności:</label>
                <select id="difficulty">
                    <option value="Łatwy">Łatwy</option>
                    <option value="Średnio-zaawansowany">Średnio-zaawansowany</option>
                    <option value="Zaawansowany">Zaawansowany</option>
                </select>
            </div>
            <div class="form-group">
                <label>Ścieżka do pliku (np. `piano/DlaElizy.pdf` lub sam plik `DlaElizy.pdf`):</label>
                <input type="text" id="fileUrl" placeholder="Wpisz nazwę pliku" required>
            </div>
            <button type="submit" class="btn">➕ Dodaj nowe nuty</button>
        </form>

        <h2 style="margin-top: 30px; margin-bottom: 15px;">Lista i usuwanie nut:</h2>
        <div id="sheetsList">Ładowanie...</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyCqT-Se0QudEnaHgImvFXSR2bEWONBKUoI",
          authDomain: "oletko-nuty.firebaseapp.com",
          projectId: "oletko-nuty",
          storageBucket: "oletko-nuty.firebasestorage.app",
          messagingSenderId: "1019311578281",
          appId: "1:1019311578281:web:37924727b9fc316b632548",
          measurementId: "G-PLTPXGX37V"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const initialSheets = [
            // FORTEPIAN (piano/)
            { title: "Wiązanka piosenek urodzinowych (Sto lat!, Niech mu gwiazdka...)", author: "Melodie tradycyjne", difficulty: "Łatwy", instrument: "piano", fileUrl: "piano/Screenshot 2026-09-25 142405.png" },
            { title: "Triumfy Króla Niebieskiego", author: "Kolęda tradycyjna", difficulty: "Łatwy", instrument: "piano", fileUrl: "piano/Kolędy w prostym układzie na fortepian_page-0013.jpg" },
            { title: "Mędrcy świata, Monarchowie", author: "Kolęda tradycyjna", difficulty: "Łatwy", instrument: "piano", fileUrl: "piano/Kolędy w prostym układzie na fortepian_page-0014.jpg" },
            { title: "Pirates Of The Caribbean - He's a Pirate", author: "Klaus Badelt", difficulty: "Średnio-zaawansowany", instrument: "piano", fileUrl: "piano/Pirates Of The Caraibben - Hes A Pirate.pdf" },
            { title: "Fly Me To The Moon", author: "arr. Thomas L.S. Pang / Bart Howard", difficulty: "Średnio-zaawansowany", instrument: "piano", fileUrl: "piano/FlyMeToTheMoon-Fortepian.pdf" },
            { title: "Dla Elizy (Für Elise)", author: "Ludwig van Beethoven", difficulty: "Średnio-zaawansowany", instrument: "piano", fileUrl: "piano/DlaElizy-Fortepian.pdf" },
            { title: "Mazurek Dąbrowskiego (Hymn Polski)", author: "Józef Wybicki", difficulty: "Łatwy", instrument: "piano", fileUrl: "piano/MazurekDabrowskiego-Fortepian.pdf" },

            // SAKSOFON (saxalto/ & saxtenor/)
            { title: "Sto lat", author: "melodia tradycyjna", difficulty: "Łatwy", instrument: "sax", subCategory: "alt", fileUrl: "saxalto/stolat-saxalt.png" },
            { title: "Wlazł kotek na płotek", author: "melodia ludowa", difficulty: "Łatwy", instrument: "sax", subCategory: "alt", fileUrl: "saxalto/wlazłkoteknapłotek.png" },
            { title: "Fly Me To The Moon (Alt)", author: "arr. Bart Howard", difficulty: "Łatwy", instrument: "sax", subCategory: "alt", fileUrl: "saxalto/Flymetothemoon.jpg" },
            { title: "Fly Me To The Moon (Tenor)", author: "arr. Bart Howard", difficulty: "Łatwy", instrument: "sax", subCategory: "tenor", fileUrl: "saxtenor/FlyMetothemoon-saxtenor.png" },
            { title: "One Note Samba (Tenor)", author: "Antônio Carlos Jobim", difficulty: "Łatwy", instrument: "sax", subCategory: "tenor", fileUrl: "saxtenor/Sax Tenor - Solo_page-0026.jpg" },
            { title: "Czerwone Maki na Monte Cassino", author: "Alfred Schütz / Feliks Konarski", difficulty: "Łatwy", instrument: "sax", subCategory: "alt", fileUrl: "saxalto/CzerwoneMakiNaMonteCasino.jpg" },
            { title: "Pałacyk Michla", author: "Józef Szczepański \"Ziutek\"", difficulty: "Łatwy", instrument: "sax", subCategory: "alt", fileUrl: "saxalto/PałacykMichla.jpg" },
            { title: "Bogurodzica", author: "pieśń religijna", difficulty: "Łatwy", instrument: "sax", subCategory: "alt", fileUrl: "saxalto/Bogurodzica.jpg" },
            { title: "My, Pierwsza Brygada", author: "Andrzej Hałaciński", difficulty: "Łatwy", instrument: "sax", subCategory: "alt", fileUrl: "saxalto/MyPierwszaBrygada.jpg" },
            { title: "Deszcz, jesienny deszcz", author: "Marian Matuszkiewicz", difficulty: "Łatwy", instrument: "sax", subCategory: "alt", fileUrl: "saxalto/Deszczjesiennydeszcz.jpg" },
            { title: "Idzie żołnierz", author: "melodia ludowa", difficulty: "Łatwy", instrument: "sax", subCategory: "alt", fileUrl: "saxalto/Idziezolnierz.jpg" },
            { title: "Piechota (Maszerują strzelcy)", author: "Bolesław Lubicz-Zahorski", difficulty: "Łatwy", instrument: "sax", subCategory: "alt", fileUrl: "saxalto/Piechota.jpg" },
            { title: "Przybyli ułani pod okienko", author: "Feliks Gwiżdż", difficulty: "Łatwy", instrument: "sax", subCategory: "alt", fileUrl: "saxalto/Przybyliulanipodokienko.jpg" },
            { title: "O mój Rozmarynie", author: "Wacław Denhoff-Czarnocki", difficulty: "Łatwy", instrument: "sax", subCategory: "alt", fileUrl: "saxalto/Rozmaryn.jpg" },
            { title: "Serce w plecaku", author: "Michał Zieliński", difficulty: "Łatwy", instrument: "sax", subCategory: "alt", fileUrl: "saxalto/Sercewplecaku.jpg" },
            { title: "Wojenko, wojenko", author: "pieśń legionowa", difficulty: "Łatwy", instrument: "sax", subCategory: "alt", fileUrl: "saxalto/Wojenkowojenko.jpg" },
            { title: "Misty (Tenor)", author: "Erroll Garner", difficulty: "Łatwy", instrument: "sax", subCategory: "tenor", fileUrl: "saxtenor/Misty-Saxtenor.jpg" },
            { title: "The Entertainer (Tenor)", author: "Scott Joplin", difficulty: "Średnio-zaawansowany", instrument: "sax", subCategory: "tenor", fileUrl: "saxtenor/TheEnterTainer-SaxTenor.jpg" },

            // TRĄBKA (trumpetinB/ & trumpetinEs/)
            { title: "Wlazł kotek na płotek", author: "melodia ludowa", difficulty: "Łatwy", instrument: "trumpet", subCategory: "b", fileUrl: "trumpetinB/wlazlkotek.jpg" },
            { title: "Back To The Future", author: "Alan Silvestri", difficulty: "Łatwy", instrument: "trumpet", subCategory: "b", fileUrl: "trumpetinB/Najlepsze kawałki muzyki filmowej Trąbka Bb_page-0002.jpg" },
            { title: "Forrest Gump - Main Title", author: "Alan Silvestri", difficulty: "Łatwy", instrument: "trumpet", subCategory: "b", fileUrl: "trumpetinB/Najlepsze kawałki muzyki filmowej Trąbka Bb_page-0003.jpg" },
            { title: "The John Dunbar Theme", author: "John Barry", difficulty: "Łatwy", instrument: "trumpet", subCategory: "b", fileUrl: "trumpetinB/Najlepsze kawałki muzyki filmowej Trąbka Bb_page-0005.jpg" },
            { title: "Rozkwitały pęki białych róż", author: "Mieczysław Kozar-Słobódzki", difficulty: "Łatwy", instrument: "trumpet", subCategory: "b", fileUrl: "trumpetinB/G Rozkwitały pęki białych róż.jpg" },
            { title: "Piechota (Maszerują strzelcy)", author: "Bolesław Lubicz-Zahorski", difficulty: "Łatwy", instrument: "trumpet", subCategory: "b", fileUrl: "trumpetinB/G Piechota.jpg" },
            { title: "Czerwone Maki na Monte Cassino", author: "Alfred Schütz / Feliks Konarski", difficulty: "Łatwy", instrument: "trumpet", subCategory: "b", fileUrl: "trumpetinB/Czerwone maki.jpg" },

            // AKORDEON (Akordeon/)
            { title: "Fale Dunaju (Donau-Wellen Walzer)", author: "Iosif Ivanovici", difficulty: "Średnio-zaawansowany", instrument: "accordion", fileUrl: "Akordeon/Fale dunaju akordeon.pdf" },
            { title: "La Valse à Margaux (Walc Margaux)", author: "Richard Galliano", difficulty: "Zaawansowany", instrument: "accordion", fileUrl: "Akordeon/Galliano - La valse a Margaux.pdf" },
            { title: "Indifférence (Valse Musette)", author: "Tony Murena & Joseph Colombo", difficulty: "Średnio-zaawansowany", instrument: "accordion", fileUrl: "Akordeon/Galliano - Indifference.pdf" },
            { title: "Divertissement (Дивертисмент)", author: "André Astier & Maurice Denoux", difficulty: "Zaawansowany", instrument: "accordion", fileUrl: "Akordeon/Astier - Divertisment.pdf" },
            { title: "Asturia (Preludium)", author: "Isaac Albéniz / arr. Friedrich Lips", difficulty: "Zaawansowany", instrument: "accordion", fileUrl: "Akordeon/Asturia.pdf" }
        ];

        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const pass = document.getElementById('adminPass').value;
            if (pass === 'oletko2026') {
                document.getElementById('login-overlay').style.display = 'none';
                loadAdminSheets();
            } else {
                alert('Błędne hasło!');
            }
        });

        document.getElementById('resetBtn').addEventListener('click', async () => {
            if (confirm("Czy na pewno chcesz wyczyszczać całą bazę i załadować nuty ponownie bez duplikatów?")) {
                const querySnapshot = await getDocs(collection(db, "sheets"));
                for (const documentSnap of querySnapshot.docs) {
                    await deleteDoc(doc(db, "sheets", documentSnap.id));
                }
                for (const item of initialSheets) {
                    await addDoc(collection(db, "sheets"), item);
                }
                alert("Baza danych została odświeżona!");
                loadAdminSheets();
            }
        });

        document.getElementById('instrument').addEventListener('change', () => {
            const instr = document.getElementById('instrument').value;
            const subGroup = document.getElementById('subCatGroup');
            if (instr === 'sax' || instr === 'trumpet') {
                subGroup.style.display = 'block';
            } else {
                subGroup.style.display = 'none';
            }
        });

        async function loadAdminSheets() {
            const listContainer = document.getElementById('sheetsList');
            listContainer.innerHTML = 'Ładowanie...';
            try {
                const querySnapshot = await getDocs(collection(db, "sheets"));
                listContainer.innerHTML = '';
                querySnapshot.forEach((documentSnap) => {
                    const data = documentSnap.data();
                    const item = document.createElement('div');
                    item.className = 'sheet-item';
                    item.innerHTML = `
                        <div>
                            <strong>${data.title}</strong> (${data.instrument})
                            <br><small>${data.fileUrl}</small>
                        </div>
                        <button class="btn btn-danger" data-id="${documentSnap.id}">Usuń</button>
                    `;
                    listContainer.appendChild(item);
                });

                document.querySelectorAll('.btn-danger').forEach(button => {
                    button.addEventListener('click', async (e) => {
                        const id = e.target.getAttribute('data-id');
                        if (confirm('Czy na pewno chcesz usunąć ten utwór z bazy?')) {
                            await deleteDoc(doc(db, "sheets", id));
                            loadAdminSheets();
                        }
                    });
                });
            } catch (e) {
                console.error(e);
            }
        }

        document.getElementById('addSheetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const newSheet = {
                title: document.getElementById('title').value,
                author: document.getElementById('author').value,
                instrument: document.getElementById('instrument').value,
                subCategory: document.getElementById('subCategory').value,
                difficulty: document.getElementById('difficulty').value,
                fileUrl: document.getElementById('fileUrl').value
            };

            await addDoc(collection(db, "sheets"), newSheet);
            alert('Dodano nuty!');
            document.getElementById('addSheetForm').reset();
            loadAdminSheets();
        });
    </script>
</body>
</html>
