<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oletko Nuty - Darmowe Nuty</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #f9f9f9; color: #333; }
        header { text-align: center; padding: 20px 0; background: #222; color: #fff; border-radius: 8px; }
        nav { text-align: center; margin: 20px 0; }
        nav button { font-size: 16px; padding: 10px 20px; margin: 5px; border: none; background-color: #007bff; color: white; border-radius: 5px; cursor: pointer; }
        nav button:hover { background-color: #0056b3; }
        .tab-content { display: none; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); max-width: 800px; margin: 0 auto; }
        .active { display: block; }
        .sheet-item { border-bottom: 1px solid #eee; padding: 15px 0; display: flex; justify-content: space-between; align-items: center; }
        .download-btn { background-color: #28a745; color: white; padding: 8px 15px; text-decoration: none; border-radius: 5px; font-weight: bold; }
        .download-btn:hover { background-color: #218838; }
    </style>
</head>
<body>

<header>
    <h1>Oletko Nuty</h1>
    <p>Darmowe nuty na fortepian i saksofon - Aleksander Frontczak</p>
</header>

<nav>
    <button onclick="openTab('fortepian')">Fortepian</button>
    <button onclick="openTab('saksofon')">Saksofon</button>
</nav>

<!-- ZAKŁADKA FORTEPIAN -->
<div id="fortepian" class="tab-content active">
    <h2>Nuty na Fortepian</h2>
    
    <!-- TUTAJ DODAJESZ KOLEJNE UTWORY NA FORTEPIAN -->
    <div class="sheet-item">
        <div>
            <strong>Przykładowy Utwór nr 1</strong><br>
            <small>Kompozytor / Poprawka</small>
        </div>
        <a href="nazwa-pliku-1.pdf" class="download-btn" download>Pobierz PDF</a>
    </div>

</div>

<!-- ZAKŁADKA SAKSOFON -->
<div id="saksofon" class="tab-content">
    <h2>Nuty na Saksofon</h2>
    
    <!-- TUTAJ DODAJESZ KOLEJNE UTWORY NA SAKSOFON -->
    <div class="sheet-item">
        <div>
            <strong>Przykładowy Utwór nr 1</strong><br>
            <small>Kompozytor / Poprawka</small>
        </div>
        <a href="nazwa-pliku-saksofon.pdf" class="download-btn" download>Pobierz PDF</a>
    </div>

</div>

<script>
    function openTab(tabName) {
        var contents = document.getElementsByClassName("tab-content");
        for (var i = 0; i < contents.length; i++) {
            contents[i].classList.remove("active");
        }
        document.getElementById(tabName).classList.add("active");
    }
</script>

</body>
</html>
